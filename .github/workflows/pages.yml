# Chœur Maris Stella — Travail des voix
# Construit le site et le publie sur GitHub Pages, à chaque modification de la branche main.
# Les modèles copista (Apache-2.0, KobiMusic) et le détecteur de page DocAligner (Apache-2.0) sont
# fabriqués ici même et publiés AVEC le site (dossier models/) : aucun service extérieur n'est
# nécessaire pour faire fonctionner l'outil. Seul le petit modèle (copista-2m, ≈16 Mo) est exporté.
name: Publier le site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: astral-sh/setup-uv@v6

      # Les modèles ne sont refabriqués que si les scripts d'export changent.
      - id: models-cache
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-2m-${{ hashFiles('scripts/models/export_copista.py', 'scripts/models/fetch_docaligner.py') }}

      - name: Fabriquer les modèles (copista-2m + DocAligner)
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          uv run scripts/models/export_copista.py --sizes 2m --out public/models
          uv run scripts/models/fetch_docaligner.py --out public/models

      - name: Construire le site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
